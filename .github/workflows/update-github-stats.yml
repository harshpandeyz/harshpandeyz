name: Update GitHub Stats

on:
  schedule:
    - cron: '17 0 * * *'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - '.github/scripts/generate-github-stats.js'
      - '.github/workflows/update-github-stats.yml'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate live GitHub statistics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: harshpandeyz
        run: node .github/scripts/generate-github-stats.js

      - name: Commit generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/github-stats.svg assets/github-contributions.svg
          git diff --cached --quiet || git commit -m 'chore: update GitHub stats'
          git push
