<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720" role="img" aria-labelledby="av-title av-desc">
<title id="av-title">Harsh Pandey — illustrated portrait</title>
<desc id="av-desc">An editorial gouache and ink portrait with a copper orbit and subtle hover motion.</desc>
<defs>
  <radialGradient id="a-bg" cx="50%" cy="30%" r="75%"><stop stop-color="#4C3028"/><stop offset=".45" stop-color="#241B1A"/><stop offset="1" stop-color="#171614"/></radialGradient>
  <linearGradient id="a-ring" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#D6F06A"/><stop offset=".45" stop-color="#E8B17B"/><stop offset="1" stop-color="#7C2D2D"/></linearGradient>
  <pattern id="a-paper" width="90" height="90" patternUnits="userSpaceOnUse"><circle cx="12" cy="18" r=".8" fill="#F6EAD5" opacity=".17"/><circle cx="74" cy="60" r=".65" fill="#F6EAD5" opacity=".12"/><path d="M20 75h18" stroke="#D6F06A" stroke-opacity=".08"/></pattern>
  <clipPath id="a-clip"><circle cx="360" cy="344" r="253"/></clipPath>
  <filter id="a-shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#000" flood-opacity=".52"/></filter>
</defs>
<style><![CDATA[
.a-breathe{animation:aBreathe 5.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes aBreathe{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.a-orbit{fill:none;stroke:#D8C09E;stroke-width:1.5;stroke-dasharray:3 11;animation:aOrbit 24s linear infinite;transform-origin:360px 344px}@keyframes aOrbit{to{transform:rotate(360deg)}}
.a-spark{animation:aSpark 3.4s ease-in-out infinite}@keyframes aSpark{0%,100%{opacity:.4}50%{opacity:1}}
#a-hit{cursor:pointer}.a-caption{transition:opacity .4s,transform .4s;opacity:.72}#a-hit:hover .a-caption{opacity:1;transform:translateY(-6px)}#a-hit:hover .a-breathe{transform:translateY(-12px) scale(1.015)}#a-hit:hover .a-ring{stroke:#D6F06A;stroke-width:3}
@media(prefers-reduced-motion:reduce){.a-breathe,.a-orbit,.a-spark{animation:none}}
]]></style>
<rect width="720" height="720" rx="36" fill="url(#a-bg)"/><rect width="720" height="720" rx="36" fill="url(#a-paper)" opacity=".5"/>
<g id="a-hit">
  <ellipse cx="360" cy="640" rx="220" ry="30" fill="#0B0A09" opacity=".6"/><ellipse class="a-orbit" cx="360" cy="344" rx="304" ry="112" transform="rotate(-19 360 344)"/><ellipse class="a-orbit" cx="360" cy="344" rx="286" ry="138" transform="rotate(61 360 344)" opacity=".55"/>
  <circle class="a-ring" cx="360" cy="344" r="267" fill="none" stroke="url(#a-ring)" stroke-width="2" opacity=".9"/><circle cx="360" cy="344" r="253" fill="#171614" stroke="#D8C09E" stroke-opacity=".3"/>
  <g class="a-breathe" filter="url(#a-shadow)" clip-path="url(#a-clip)"><image href="portrait.png" x="67" y="60" width="586" height="577" preserveAspectRatio="xMidYMid meet"/></g>
  <circle class="a-spark" cx="145" cy="200" r="5" fill="#D6F06A"/><circle class="a-spark" cx="586" cy="498" r="4" fill="#E8B17B" style="animation-delay:1.2s"/><path d="M92 566h84" stroke="#D8C09E" stroke-opacity=".55"/><text x="92" y="592" fill="#D8C09E" font-family="Arial,sans-serif" font-size="11" letter-spacing="2">HARSH / 01</text>
  <g class="a-caption" transform="translate(482 558)"><rect width="145" height="40" rx="20" fill="#D6F06A"/><text x="72.5" y="25" text-anchor="middle" fill="#171614" font-family="Arial,sans-serif" font-size="12" font-weight="700">NICE TO MEET YOU ↗</text></g>
</g>
</svg>
