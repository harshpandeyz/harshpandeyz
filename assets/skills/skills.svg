<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="820" viewBox="0 0 1600 820" role="img" aria-labelledby="sk-title sk-desc">
<title id="sk-title">Skills — the workshop map</title><desc id="sk-desc">A museum-style skills map with six material families, experience bars, and evidence notes.</desc>
<defs><linearGradient id="sk-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#211C1A"/><stop offset="1" stop-color="#101615"/></linearGradient><linearGradient id="sk-line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#D6F06A"/><stop offset=".5" stop-color="#E8B17B"/><stop offset="1" stop-color="#9BAE91"/></linearGradient><pattern id="sk-paper" width="100" height="100" patternUnits="userSpaceOnUse"><circle cx="17" cy="23" r=".7" fill="#F6EAD5" opacity=".14"/><circle cx="78" cy="61" r=".6" fill="#D6F06A" opacity=".1"/></pattern></defs>
<style><![CDATA[.sk-card{transition:filter .3s}.sk-card:hover{filter:brightness(1.16)}.sk-fill{animation:skFill 1.5s ease-out both;transform-box:fill-box;transform-origin:left}@keyframes skFill{from{transform:scaleX(0)}to{transform:scaleX(1)}}.sk-pulse{animation:skPulse 3s ease-in-out infinite}@keyframes skPulse{0%,100%{opacity:.6}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.sk-fill,.sk-pulse{animation:none}}]]></style>
<rect width="1600" height="820" rx="28" fill="url(#sk-bg)"/><rect width="1600" height="820" rx="28" fill="url(#sk-paper)" opacity=".52"/><path d="M48 86H1552" stroke="#D8C09E" stroke-opacity=".24"/><text x="48" y="52" fill="#F6EAD5" font-family="Georgia,serif" font-size="29">The workshop map</text><text x="1552" y="51" text-anchor="end" fill="#AFA08E" font-family="Arial,sans-serif" font-size="12">honest proficiency · evidence-linked · still learning</text>
<g class="sk-card" transform="translate(48 116)" font-family="Arial,sans-serif"><rect width="480" height="300" rx="20" fill="#F6EAD5" fill-opacity=".055" stroke="#D6F06A" stroke-opacity=".45"/><text x="28" y="45" fill="#D6F06A" font-size="11" font-weight="700" letter-spacing="2">01 / LANGUAGE</text><text x="28" y="86" fill="#F6EAD5" font-family="Georgia,serif" font-size="25">The grammar of making</text><text x="28" y="116" fill="#AFA08E" font-size="12">Python · JavaScript · TypeScript · Java</text><text x="28" y="166" fill="#BFAF9A" font-size="11">PYTHON</text><rect x="104" y="160" width="330" height="8" rx="4" fill="#F6EAD5" fill-opacity=".1"/><rect x="104" y="160" width="292" height="8" rx="4" fill="#D6F06A" class="sk-fill"/><text x="28" y="202" fill="#BFAF9A" font-size="11">TYPESCRIPT</text><rect x="104" y="196" width="330" height="8" rx="4" fill="#F6EAD5" fill-opacity=".1"/><rect x="104" y="196" width="255" height="8" rx="4" fill="#C6DF68" class="sk-fill"/><text x="28" y="238" fill="#BFAF9A" font-size="11">JAVA / KOTLIN / SWIFT</text><rect x="174" y="232" width="260" height="8" rx="4" fill="#F6EAD5" fill-opacity=".1"/><rect x="174" y="232" width="190" height="8" rx="4" fill="#9BAE91" class="sk-fill"/><text x="28" y="275" fill="#806C5A" font-size="11">shipped across web, mobile, and APIs</text></g>
<g class="sk-card" transform="translate(560 116)" font-family="Arial,sans-serif"><rect width="480" height="300" rx="20" fill="#F6EAD5" fill-opacity=".055" stroke="#B87445" stroke-opacity=".55"/><text x="28" y="45" fill="#E8B17B" font-size="11" font-weight="700" letter-spacing="2">02 / INTELLIGENCE</text><text x="28" y="86" fill="#F6EAD5" font-family="Georgia,serif" font-size="25">Teaching systems to notice</text><text x="28" y="116" fill="#AFA08E" font-size="12">RAG · vector search · agents · vision</text><text x="28" y="166" fill="#BFAF9A" font-size="11">RAG / FAISS</text><rect x="114" y="160" width="320" height="8" rx="4" fill="#F6EAD5" fill-opacity=".1"/><rect x="114" y="160" width="244" height="8" rx="4" fill="#B87445" class="sk-fill"/><text x="28" y="202" fill="#BFAF9A" font-size="11">YOLO / OPENCV</text><rect x="114" y="196" width="320" height="8" rx="4" fill="#F6EAD5" fill-opacity=".1"/><rect x="114" y="196" width="225" height="8" rx="4" fill="#D7A45B" class="sk-fill"/><text x="28" y="238" fill="#BFAF9A" font-size="11">AGENTS / ORCHESTRATION</text><rect x="174" y="232" width="260" height="8" rx="4" fill="#F6EAD5" fill-opacity=".1"/><rect x="174" y="232" width="190" height="8" rx="4" fill="#E8B17B" class="sk-fill"/><text x="28" y="275" fill="#806C5A" font-size="11">applied to research, vision, and runtime</text></g>
<g class="sk-card" transform="translate(1072 116)" font-family="Arial,sans-serif"><rect width="480" height="300" rx="20" fill="#F6EAD5" fill-opacity=".055" stroke="#9BAE91" stroke-opacity=".55"/><text x="28" y="45" fill="#9BAE91" font-size="11" font-weight="700" letter-spacing="2">03 / SURFACES</text><text x="28" y="86" fill="#F6EAD5" font-family="Georgia,serif" font-size="25">A place for the idea</text><text x="28" y="116" fill="#AFA08E" font-size="12">React · Vite · HTML/CSS · Tailwind</text><text x="28" y="166" fill="#BFAF9A" font-size="11">FRONTEND SYSTEMS</text><rect x="164" y="160" width="270" height="8" rx="4" fill="#F6EAD5" fill-opacity=".1"/><rect x="164" y="160" width="230" height="8" rx="4" fill="#9BAE91" class="sk-fill"/><text x="28" y="202" fill="#BFAF9A" font-size="11">MOTION / ACCESSIBILITY</text><rect x="164" y="196" width="270" height="8" rx="4" fill="#F6EAD5" fill-opacity=".1"/><rect x="164" y="196" width="205" height="8" rx="4" fill="#B4C891" class="sk-fill"/><text x="28" y="238" fill="#BFAF9A" font-size="11">DESIGN SYSTEMS</text><rect x="164" y="232" width="270" height="8" rx="4" fill="#F6EAD5" fill-opacity=".1"/><rect x="164" y="232" width="184" height="8" rx="4" fill="#7F995D" class="sk-fill"/><text x="28" y="275" fill="#806C5A" font-size="11">restrained, responsive, built to be read</text></g>
<g class="sk-card" transform="translate(48 448)" font-family="Arial,sans-serif"><rect width="480" height="300" rx="20" fill="#F6EAD5" fill-opacity=".055" stroke="#D8664B" stroke-opacity=".5"/><text x="28" y="45" fill="#D8664B" font-size="11" font-weight="700" letter-spacing="2">04 / BACKBONE</text><text x="28" y="86" fill="#F6EAD5" font-family="Georgia,serif" font-size="25">The quiet machinery</text><text x="28" y="116" fill="#AFA08E" font-size="12">Node · FastAPI · Spring Boot · REST</text><text x="28" y="166" fill="#BFAF9A" font-size="11">API DESIGN</text><rect x="110" y="160" width="324" height="8" rx="4" fill="#F6EAD5" fill-opacity=".1"/><rect x="110" y="160" width="245" height="8" rx="4" fill="#D8664B" class="sk-fill"/><text x="28" y="202" fill="#BFAF9A" font-size="11">DATABASES</text><rect x="110" y="196" width="324" height="8" rx="4" fill="#F6EAD5" fill-opacity=".1"/><rect x="110" y="196" width="224" height="8" rx="4" fill="#B87445" class="sk-fill"/><text x="28" y="238" fill="#BFAF9A" font-size="11">AUTH / RBAC</text><rect x="110" y="232" width="324" height="8" rx="4" fill="#F6EAD5" fill-opacity=".1"/><rect x="110" y="232" width="198" height="8" rx="4" fill="#8D5A43" class="sk-fill"/><text x="28" y="275" fill="#806C5A" font-size="11">secure defaults · models that can grow up</text></g>
<g class="sk-card" transform="translate(560 448)" font-family="Arial,sans-serif"><rect width="480" height="300" rx="20" fill="#F6EAD5" fill-opacity=".055" stroke="#D7A45B" stroke-opacity=".5"/><text x="28" y="45" fill="#D7A45B" font-size="11" font-weight="700" letter-spacing="2">05 / DELIVERY</text><text x="28" y="86" fill="#F6EAD5" font-family="Georgia,serif" font-size="25">Make it survive contact</text><text x="28" y="116" fill="#AFA08E" font-size="12">Docker · CI/CD · AWS · Jenkins · Linux</text><text x="28" y="166" fill="#BFAF9A" font-size="11">DOCKER / CI</text><rect x="118" y="160" width="316" height="8" rx="4" fill="#F6EAD5" fill-opacity=".1"/><rect x="118" y="160" width="244" height="8" rx="4" fill="#D7A45B" class="sk-fill"/><text x="28" y="202" fill="#BFAF9A" font-size="11">CLOUD</text><rect x="118" y="196" width="316" height="8" rx="4" fill="#F6EAD5" fill-opacity=".1"/><rect x="118" y="196" width="192" height="8" rx="4" fill="#E8B17B" class="sk-fill"/><text x="28" y="238" fill="#BFAF9A" font-size="11">SYSTEM DESIGN</text><rect x="118" y="232" width="316" height="8" rx="4" fill="#F6EAD5" fill-opacity=".1"/><rect x="118" y="232" width="158" height="8" rx="4" fill="#8D5A43" class="sk-fill"/><text x="28" y="275" fill="#806C5A" font-size="11">learning in public; shipping in small loops</text></g>
<g class="sk-card" transform="translate(1072 448)" font-family="Arial,sans-serif"><rect width="480" height="300" rx="20" fill="#F6EAD5" fill-opacity=".055" stroke="#D6F06A" stroke-opacity=".45"/><text x="28" y="45" fill="#D6F06A" font-size="11" font-weight="700" letter-spacing="2">06 / TOOLING</text><text x="28" y="86" fill="#F6EAD5" font-family="Georgia,serif" font-size="25">The hands at the workbench</text><text x="28" y="116" fill="#AFA08E" font-size="12">Git · GitHub · VS Code · Postman · Shell</text><text x="28" y="166" fill="#BFAF9A" font-size="11">VERSION CONTROL</text><rect x="160" y="160" width="274" height="8" rx="4" fill="#F6EAD5" fill-opacity=".1"/><rect x="160" y="160" width="246" height="8" rx="4" fill="#D6F06A" class="sk-fill"/><text x="28" y="202" fill="#BFAF9A" font-size="11">DEBUGGING</text><rect x="160" y="196" width="274" height="8" rx="4" fill="#F6EAD5" fill-opacity=".1"/><rect x="160" y="196" width="231" height="8" rx="4" fill="#C6DF68" class="sk-fill"/><text x="28" y="238" fill="#BFAF9A" font-size="11">SOLIDITY</text><rect x="160" y="232" width="274" height="8" rx="4" fill="#F6EAD5" fill-opacity=".1"/><rect x="160" y="232" width="120" height="8" rx="4" fill="#9BAE91" class="sk-fill"/><text x="28" y="275" fill="#806C5A" font-size="11">practical tools, no ceremony</text></g>
