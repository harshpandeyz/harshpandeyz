<svg xmlns="http://www.w3.org/2000/svg" width="960" height="190" viewBox="0 0 960 190" role="img" aria-label="Intelligent Mob Surveillance System — AI video surveillance with verified evidence">
  <defs>
    <linearGradient id="svBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#070D22"/>
      <stop offset="1" stop-color="#0A1A33"/>
    </linearGradient>
    <radialGradient id="svGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="svCone" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="960" height="190" rx="14" fill="url(#svBg)"/>
  <ellipse cx="790" cy="95" rx="220" ry="110" fill="url(#svGlow)"/>
  <rect x="1" y="1" width="958" height="188" rx="13" fill="none" stroke="#22304F" stroke-width="1.5"/>
  <rect x="1" y="1" width="6" height="188" fill="#22D3EE"/>

  <text x="44" y="66" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" letter-spacing="4" fill="#22D3EE">01 · PERCEPTION + TRUST</text>
  <text x="42" y="112" font-family="system-ui,-apple-system,'Segoe UI',Inter,sans-serif" font-size="36" font-weight="700" letter-spacing="-0.5" fill="#F2F6FD">Intelligent Mob Surveillance</text>
  <text x="44" y="146" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" letter-spacing="1" fill="#8B98B8">YOLOv8 detection · encrypted evidence · blockchain verification</text>

  <!-- CCTV scan motif -->
  <g>
    <circle cx="800" cy="52" r="10" fill="#0C1631" stroke="#22D3EE" stroke-width="2"/>
    <circle cx="800" cy="52" r="3.5" fill="#22D3EE"/>
    <polygon points="800,52 730,150 870,150" fill="url(#svCone)"/>
    <line x1="736" y1="118" x2="864" y2="118" stroke="#22D3EE" stroke-width="2" stroke-linecap="round">
      <animate attributeName="y1" values="80;150;80" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="y2" values="80;150;80" dur="3.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.9;0.3;0.9" dur="3.2s" repeatCount="indefinite"/>
    </line>
    <g fill="none" stroke="#22D3EE" stroke-width="2" opacity="0.9">
      <path d="M712 132 h22 M712 132 v22"/>
      <path d="M888 132 h-22 M888 132 v22"/>
      <path d="M712 168 h22 M712 168 v-22" opacity="0.45"/>
      <path d="M888 168 h-22 M888 168 v-22" opacity="0.45"/>
    </g>
    <rect x="742" y="140" width="116" height="22" rx="4" fill="#0C1631" stroke="#22D3EE" stroke-opacity="0.6"/>
    <text x="800" y="156" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" letter-spacing="2" fill="#22D3EE">REC ● HASHED</text>
  </g>
