<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="s-title s-desc">
<title id="s-title">Intelligent Mob Surveillance System</title><desc id="s-desc">A red and celadon field instrument for real-time vision and evidence handling.</desc>
<defs><linearGradient id="s-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#301F1E"/><stop offset=".6" stop-color="#171A18"/><stop offset="1" stop-color="#0F1515"/></linearGradient><radialGradient id="s-glow"><stop stop-color="#D8664B" stop-opacity=".36"/><stop offset="1" stop-color="#D8664B" stop-opacity="0"/></radialGradient><pattern id="s-map" width="36" height="36" patternUnits="userSpaceOnUse"><path d="M0 28L14 0M7 36L36 7M27 36L36 27" stroke="#D8C09E" stroke-opacity=".08"/></pattern><filter id="s-shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".4"/></filter></defs>
<style><![CDATA[.s-scan{animation:sScan 4s ease-in-out infinite}@keyframes sScan{0%,100%{transform:translateY(-78px);opacity:.05}50%{transform:translateY(86px);opacity:.65}}.s-pulse{animation:sPulse 2.8s ease-in-out infinite}@keyframes sPulse{0%,100%{opacity:.5}50%{opacity:1}}.s-card{transition:filter .3s}.s-card:hover{filter:brightness(1.16)}@media(prefers-reduced-motion:reduce){.s-scan,.s-pulse{animation:none}}]]></style>
<rect width="760" height="420" rx="28" fill="url(#s-bg)"/><rect width="760" height="420" rx="28" fill="url(#s-map)"/><ellipse cx="590" cy="140" rx="230" ry="170" fill="url(#s-glow)"/><path d="M34 70H726M34 350H726" stroke="#D8C09E" stroke-opacity=".2"/>
<g font-family="Arial,sans-serif"><text x="38" y="44" fill="#D6F06A" font-size="11" font-weight="700" letter-spacing="2.4">01 / 04 · FIELD SYSTEM</text><text x="722" y="44" text-anchor="end" fill="#D8C09E" font-size="11" letter-spacing="1.4">PYTHON / CV / SOLIDITY</text><text x="38" y="106" fill="#F6EAD5" font-family="Georgia,serif" font-size="31">Intelligent Mob</text><text x="38" y="141" fill="#F6EAD5" font-family="Georgia,serif" font-size="31" font-style="italic">Surveillance System</text><text x="38" y="176" fill="#BFAF9A" font-size="13">Real-time vision, decisions, and tamper-aware evidence.</text></g>
<g class="s-card" transform="translate(450 92)" filter="url(#s-shadow)"><rect width="236" height="184" rx="12" fill="#111716" stroke="#D8C09E" stroke-opacity=".35"/><rect x="15" y="15" width="206" height="132" rx="7" fill="#1B2621" stroke="#9BAE91" stroke-opacity=".35"/><path d="M23 122L77 74L116 99L168 46L214 86M34 38h46M178 120h31" fill="none" stroke="#9BAE91" stroke-width="2" opacity=".72"/><path d="M15 73H221" class="s-scan" stroke="#D6F06A" stroke-width="2"/><circle cx="168" cy="46" r="12" fill="none" stroke="#D8664B" stroke-width="2" class="s-pulse"/><circle cx="168" cy="46" r="3" fill="#D8664B"/><text x="19" y="171" fill="#9BAE91" font-size="10" letter-spacing="1.2">LIVE / ZONE 04 / 98.2%</text></g>
<g font-family="Arial,sans-serif"><circle cx="42" cy="319" r="5" fill="#D6F06A"/><text x="58" y="323" fill="#E7D7BE" font-size="13">Vision → alert → evidence trail</text><text x="722" y="322" text-anchor="end" fill="#D6F06A" font-size="12" font-weight="700">OPEN REPOSITORY  ↗</text><text x="38" y="386" fill="#806C5A" font-size="11" letter-spacing="1.8">01 — OBSERVE / 02 — CLASSIFY / 03 — PRESERVE</text></g>
</svg>
