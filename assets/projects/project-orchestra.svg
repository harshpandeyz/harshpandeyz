<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="o-title o-desc">
<title id="o-title">OrchestraAI</title><desc id="o-desc">A celadon control room for coordinating models, memory, tools, and runtime.</desc>
<defs><linearGradient id="o-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#1A302B"/><stop offset=".6" stop-color="#15211F"/><stop offset="1" stop-color="#101615"/></linearGradient><linearGradient id="o-wave" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#D6F06A"/><stop offset=".5" stop-color="#9BAE91"/><stop offset="1" stop-color="#E8B17B"/></linearGradient><filter id="o-shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".45"/></filter></defs>
<style><![CDATA[.o-flow{stroke-dasharray:7 11;animation:oFlow 8s linear infinite}@keyframes oFlow{to{stroke-dashoffset:-180}}.o-node{transition:transform .3s,filter .3s;transform-box:fill-box;transform-origin:center}.o-node:hover{transform:translateY(-7px);filter:brightness(1.2)}.o-wave{animation:oWave 5s ease-in-out infinite}@keyframes oWave{0%,100%{transform:scaleY(.92)}50%{transform:scaleY(1.08)}}@media(prefers-reduced-motion:reduce){.o-flow,.o-wave{animation:none}}]]></style>
<rect width="760" height="420" rx="28" fill="url(#o-bg)"/><path d="M34 70H726M34 350H726" stroke="#D8C09E" stroke-opacity=".2"/>
<g font-family="Arial,sans-serif"><text x="38" y="44" fill="#D6F06A" font-size="11" font-weight="700" letter-spacing="2.4">03 / 04 · CONTROL PLANE</text><text x="722" y="44" text-anchor="end" fill="#D8C09E" font-size="11" letter-spacing="1.4">JS / TS / RUNTIME</text><text x="38" y="106" fill="#F6EAD5" font-family="Georgia,serif" font-size="33">OrchestraAI</text><text x="38" y="142" fill="#F6EAD5" font-family="Georgia,serif" font-size="20" font-style="italic">Many minds. One considered tempo.</text><text x="38" y="176" fill="#BFAF9A" font-size="13">Models, context, memory, tools, and runtime — conducted.</text></g>
<g filter="url(#o-shadow)"><path d="M432 208H685" stroke="#9BAE91" stroke-opacity=".55" stroke-width="2" class="o-flow"/><path d="M548 208C548 153 580 124 610 208C640 292 671 263 671 208" fill="none" stroke="url(#o-wave)" stroke-width="8" stroke-linecap="round" class="o-wave"/><g class="o-node"><circle cx="444" cy="208" r="32" fill="#101A18" stroke="#D6F06A"/><text x="444" y="213" text-anchor="middle" fill="#F6EAD5" font-size="11" font-weight="700">MODEL</text></g><g class="o-node"><circle cx="526" cy="208" r="25" fill="#101A18" stroke="#9BAE91"/><text x="526" y="213" text-anchor="middle" fill="#F6EAD5" font-size="10">MEM</text></g><g class="o-node"><circle cx="684" cy="208" r="31" fill="#101A18" stroke="#E8B17B"/><text x="684" y="213" text-anchor="middle" fill="#F6EAD5" font-size="10" font-weight="700">SHIP</text></g><text x="572" y="313" text-anchor="middle" fill="#D8C09E" font-family="Arial,sans-serif" font-size="10" letter-spacing="2">COST / LATENCY / QUALITY</text></g>
<g font-family="Arial,sans-serif"><circle cx="42" cy="319" r="5" fill="#D6F06A"/><text x="58" y="323" fill="#E7D7BE" font-size="13">A runtime that knows when to change the score</text><text x="722" y="322" text-anchor="end" fill="#D6F06A" font-size="12" font-weight="700">OPEN REPOSITORY  ↗</text><text x="38" y="386" fill="#806C5A" font-size="11" letter-spacing="1.8">COMPOSE · ROUTE · OBSERVE · IMPROVE</text></g>
</svg>
