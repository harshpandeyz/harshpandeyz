<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="q-title q-desc">
<title id="q-title">QuantumMind</title><desc id="q-desc">A plum and amber research instrument for multimodal quantum intelligence.</desc>
<defs><linearGradient id="q-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2A2130"/><stop offset=".6" stop-color="#17151E"/><stop offset="1" stop-color="#111318"/></linearGradient><radialGradient id="q-wash"><stop stop-color="#D7A45B" stop-opacity=".3"/><stop offset="1" stop-color="#D7A45B" stop-opacity="0"/></radialGradient><filter id="q-shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".5"/></filter></defs>
<style><![CDATA[.q-orbit{fill:none;stroke:#D8C09E;stroke-opacity:.5;stroke-width:1.2;stroke-dasharray:3 9;animation:qSpin 18s linear infinite;transform-origin:584px 208px}@keyframes qSpin{to{transform:rotate(360deg)}}.q-star{animation:qTwinkle 2.5s ease-in-out infinite}@keyframes qTwinkle{0%,100%{opacity:.35}50%{opacity:1}}.q-card{transition:filter .3s}.q-card:hover{filter:brightness(1.18)}@media(prefers-reduced-motion:reduce){.q-orbit,.q-star{animation:none}}]]></style>
<rect width="760" height="420" rx="28" fill="url(#q-bg)"/><ellipse cx="604" cy="138" rx="222" ry="190" fill="url(#q-wash)"/><path d="M34 70H726M34 350H726" stroke="#D8C09E" stroke-opacity=".2"/>
<g font-family="Arial,sans-serif"><text x="38" y="44" fill="#D6F06A" font-size="11" font-weight="700" letter-spacing="2.4">02 / 04 · RESEARCH INSTRUMENT</text><text x="722" y="44" text-anchor="end" fill="#D8C09E" font-size="11" letter-spacing="1.4">JS / PYTHON / JAVA</text><text x="38" y="106" fill="#F6EAD5" font-family="Georgia,serif" font-size="33">QuantumMind</text><text x="38" y="142" fill="#F6EAD5" font-family="Georgia,serif" font-size="20" font-style="italic">A second pair of eyes for hard questions.</text><text x="38" y="176" fill="#BFAF9A" font-size="13">Multimodal retrieval meets quantum research reasoning.</text></g>
<g class="q-card" filter="url(#q-shadow)"><circle cx="584" cy="208" r="91" fill="#18131E" stroke="#D8C09E" stroke-opacity=".35"/><ellipse class="q-orbit" cx="584" cy="208" rx="144" ry="54" transform="rotate(-24 584 208)"/><ellipse class="q-orbit" cx="584" cy="208" rx="137" ry="48" transform="rotate(58 584 208)" opacity=".65"/><path d="M546 232C566 180 598 154 631 180C657 200 639 246 610 259C579 273 555 261 546 232Z" fill="none" stroke="#D7A45B" stroke-width="8" stroke-linecap="round"/><path d="M584 133V282M508 208H660" stroke="#D8C09E" stroke-opacity=".22"/><circle cx="544" cy="174" r="6" fill="#D6F06A" class="q-star"/><circle cx="637" cy="243" r="5" fill="#D7A45B" class="q-star" style="animation-delay:1.1s"/><circle cx="596" cy="151" r="4" fill="#B18DE6" class="q-star" style="animation-delay:.4s"/><text x="584" y="215" text-anchor="middle" fill="#F6EAD5" font-family="Georgia,serif" font-size="34" font-style="italic">Q?</text><text x="584" y="307" text-anchor="middle" fill="#D8C09E" font-family="Arial,sans-serif" font-size="10" letter-spacing="2">RETRIEVE / CONNECT / EXPLAIN</text></g>
<g font-family="Arial,sans-serif"><circle cx="42" cy="319" r="5" fill="#D6F06A"/><text x="58" y="323" fill="#E7D7BE" font-size="13">Papers, images, ideas — one research surface</text><text x="722" y="322" text-anchor="end" fill="#D6F06A" font-size="12" font-weight="700">OPEN REPOSITORY  ↗</text><text x="38" y="386" fill="#806C5A" font-size="11" letter-spacing="1.8">MULTIMODAL · CONTEXTUAL · CURIOUS</text></g>
</svg>
