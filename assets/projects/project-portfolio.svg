<g font-family="Arial,sans-serif"><circle cx="42" cy="319" r="5" fill="#D6F06A"/><text x="58" y="323" fill="#E7D7BE" font-size="13">Case studies, experiments, and a little controlled chaos</text><text x="722" y="322" text-anchor="end" fill="#D6F06A" font-size="12" font-weight="700">OPEN REPOSITORY  ↗</text><text x="38" y="386" fill="#806C5A" font-size="11" letter-spacing="1.8">DESIGNED AS A PLACE TO KEEP LOOKING</text></g>
