<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420" role="img" aria-labelledby="p-title p-desc">
<title id="p-title">new-portfolio</title><desc id="p-desc">A warm publishing desk for a public engineering practice.</desc>
<defs><linearGradient id="p-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#49352B"/><stop offset=".55" stop-color="#2A2520"/><stop offset="1" stop-color="#181915"/></linearGradient><linearGradient id="p-paper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF2DB"/><stop offset="1" stop-color="#D7C09B"/></linearGradient><filter id="p-shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".45"/></filter></defs>
<style><![CDATA[.p-page{animation:pPage 6s ease-in-out infinite;transform-origin:585px 220px}@keyframes pPage{0%,100%{transform:rotate(-3deg) translateY(0)}50%{transform:rotate(0deg) translateY(-6px)}}.p-line{stroke-dasharray:160;stroke-dashoffset:160;animation:pDraw 3.2s ease-out forwards}@keyframes pDraw{to{stroke-dashoffset:0}}.p-card{transition:filter .3s}.p-card:hover{filter:brightness(1.17)}@media(prefers-reduced-motion:reduce){.p-page,.p-line{animation:none}}]]></style>
