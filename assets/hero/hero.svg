<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="620" viewBox="0 0 1440 620" role="img" aria-labelledby="hero-title hero-desc">
<title id="hero-title">Harsh Pandey — Ideas, given a nervous system</title>
<desc id="hero-desc">A warm editorial hero with a copper signal loom, orbiting signal rings, twinkling dust, and an engineering statement. Animated, hoverable, reduced-motion safe.</desc>
<defs>
  <linearGradient id="h-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#171614"/><stop offset=".52" stop-color="#241B1A"/><stop offset="1" stop-color="#101313"/></linearGradient>
  <radialGradient id="h-wash" cx="70%" cy="42%" r="62%"><stop stop-color="#B87445" stop-opacity=".28"/><stop offset=".52" stop-color="#7C2D2D" stop-opacity=".12"/><stop offset="1" stop-color="#171614" stop-opacity="0"/></radialGradient>
  <linearGradient id="h-copper" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#E8B17B"/><stop offset=".42" stop-color="#B87445"/><stop offset="1" stop-color="#7C2D2D"/></linearGradient>
  <linearGradient id="h-paper" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#F6EAD5"/><stop offset="1" stop-color="#D7C2A2"/></linearGradient>
  <pattern id="h-grain" width="120" height="120" patternUnits="userSpaceOnUse"><circle cx="9" cy="14" r=".8" fill="#F6EAD5" opacity=".17"/><circle cx="82" cy="51" r=".65" fill="#F6EAD5" opacity=".1"/><circle cx="43" cy="96" r=".55" fill="#F6EAD5" opacity=".13"/><path d="M15 85h21M101 22h10" stroke="#D6F06A" stroke-opacity=".06"/></pattern>
  <filter id="h-shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="22" stdDeviation="18" flood-color="#000" flood-opacity=".42"/></filter>
</defs>
<style><![CDATA[
.h-orbit{fill:none;stroke:#D8C09E;stroke-opacity:.32;stroke-width:1.2;stroke-dasharray:4 10;animation:hDash 18s linear infinite}@keyframes hDash{to{stroke-dashoffset:-280}}
.h-float{animation:hFloat 6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes hFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-9px)}}
.h-node{transition:filter .35s,transform .35s;transform-box:fill-box;transform-origin:center}.h-node:hover{filter:brightness(1.35);transform:scale(1.08)}
.h-scan{animation:hScan 4.8s ease-in-out infinite}@keyframes hScan{0%,100%{opacity:.05;transform:translateY(0)}50%{opacity:.4;transform:translateY(230px)}}
.h-twinkle{animation:hTwinkle 3.4s ease-in-out infinite}@keyframes hTwinkle{0%,100%{opacity:.25}50%{opacity:1}}
.h-shimmer{stroke-dasharray:620;stroke-dashoffset:620;animation:hShimmer 3.2s ease-out .4s forwards}@keyframes hShimmer{to{stroke-dashoffset:0}}
.h-cursor{animation:hBlink 1.1s steps(1) infinite}@keyframes hBlink{0%,55%{opacity:1}56%,100%{opacity:0}}
.h-drift{animation:hDrift 9s ease-in-out infinite}@keyframes hDrift{0%,100%{transform:translate(0,0)}50%{transform:translate(10px,-12px)}}
@media(prefers-reduced-motion:reduce){.h-orbit,.h-float,.h-scan,.h-twinkle,.h-shimmer,.h-cursor,.h-drift{animation:none}.h-shimmer{stroke-dashoffset:0}}
]]></style>
<rect width="1440" height="620" rx="34" fill="url(#h-bg)"/><rect width="1440" height="620" rx="34" fill="url(#h-wash)"/><rect width="1440" height="620" rx="34" fill="url(#h-grain)" opacity=".55"/>
<path d="M55 82H1385M55 548H1385" stroke="#D8C09E" stroke-opacity=".22"/>
<text x="60" y="58" fill="#D8C09E" font-family="Arial,sans-serif" font-size="12" letter-spacing="3.4">HARSH PANDEY / BUILDER'S INDEX · 2026</text><text x="1380" y="58" text-anchor="end" fill="#D6F06A" font-family="Arial,sans-serif" font-size="12" letter-spacing="2.4">OPEN TO THE UNEXPECTED ↗</text>
<g transform="translate(60 154)"><text x="0" y="0" fill="#D6F06A" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2.2">FULL-STACK / APPLIED AI / SYSTEMS</text><text x="0" y="102" fill="url(#h-paper)" font-family="Georgia,serif" font-size="94" letter-spacing="-4">Ideas, given</text><text x="0" y="198" fill="url(#h-paper)" font-family="Georgia,serif" font-size="94" font-style="italic" letter-spacing="-4">a nervous system.<tspan fill="#D6F06A" font-size="60">_</tspan></text><path class="h-shimmer" d="M6 230C200 260 420 252 612 230" fill="none" stroke="url(#h-copper)" stroke-width="3"/><text x="4" y="284" fill="#E7D7BE" font-family="Arial,sans-serif" font-size="19">I build software that senses, reasons, orchestrates, and ships.<tspan fill="#D6F06A" class="h-cursor"> ▌</tspan></text><text x="4" y="319" fill="#AFA08E" font-family="Arial,sans-serif" font-size="15">MIT ADT University · Pune, India · currently making useful things with AI</text><g transform="translate(4 374)"><rect width="170" height="42" rx="21" fill="#D6F06A"/><text x="85" y="27" text-anchor="middle" fill="#171614" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing=".6">VIEW THE WORK  ↗</text><rect x="188" width="156" height="42" rx="21" fill="none" stroke="#D8C09E" stroke-opacity=".55"/><text x="266" y="27" text-anchor="middle" fill="#E7D7BE" font-family="Arial,sans-serif" font-size="13" letter-spacing=".6">SAY HELLO  ↗</text></g></g>
<g transform="translate(1030 330)" filter="url(#h-shadow)" class="h-float"><ellipse cx="0" cy="0" rx="286" ry="112" class="h-orbit" transform="rotate(-21)"/><ellipse cx="0" cy="0" rx="294" ry="124" class="h-orbit" transform="rotate(37)"/><ellipse cx="0" cy="0" rx="238" ry="184" class="h-orbit" transform="rotate(78)"/><circle r="154" fill="#2D2320" stroke="#D8C09E" stroke-opacity=".35" stroke-width="1.5"/><circle r="124" fill="none" stroke="url(#h-copper)" stroke-width="2" stroke-dasharray="1 9"/><circle r="94" fill="#171614" stroke="#D6F06A" stroke-opacity=".5" stroke-width="1"/><path d="M-105-11C-67-82 27-111 84-62C126-27 111 51 38 83C-35 114-104 78-105-11Z" fill="none" stroke="#B87445" stroke-width="12" stroke-linecap="round" opacity=".68"/><path d="M-74 66C-5 20 13-8 4-86M-92-51C-15-35 42-8 82 47M-58 99C-37 33 16-19 92-31" fill="none" stroke="#F0C790" stroke-opacity=".72" stroke-width="2"/><path class="h-scan" d="M-112-96H112" stroke="#D6F06A" stroke-width="2" opacity=".1"/><g class="h-node"><circle cx="-126" cy="-66" r="8" fill="#D6F06A"/><circle cx="-126" cy="-66" r="15" fill="none" stroke="#D6F06A" stroke-opacity=".28"/></g><g class="h-node"><circle cx="103" cy="-27" r="7" fill="#E8B17B"/><circle cx="103" cy="-27" r="14" fill="none" stroke="#E8B17B" stroke-opacity=".28"/></g><g class="h-node"><circle cx="65" cy="104" r="6" fill="#9BAE91"/></g><text x="0" y="10" text-anchor="middle" fill="#F6EAD5" font-family="Georgia,serif" font-size="58" font-style="italic">signal</text><text x="0" y="43" text-anchor="middle" fill="#D8C09E" font-family="Arial,sans-serif" font-size="11" letter-spacing="4">MADE TANGIBLE</text></g>
<g transform="translate(1270 472)"><path d="M0 0h86" stroke="#D6F06A"/><text x="0" y="28" fill="#D8C09E" font-family="Arial,sans-serif" font-size="11" letter-spacing="2">EST. IN CURIOSITY</text></g>
<g class="h-drift"><circle class="h-twinkle" cx="220" cy="120" r="3" fill="#D6F06A"/><circle class="h-twinkle" cx="760" cy="96" r="2.2" fill="#E8B17B" style="animation-delay:.7s"/><circle class="h-twinkle" cx="520" cy="540" r="2.6" fill="#9BAE91" style="animation-delay:1.3s"/><circle class="h-twinkle" cx="1330" cy="150" r="2.4" fill="#F6EAD5" style="animation-delay:1.9s"/><circle class="h-twinkle" cx="940" cy="540" r="2" fill="#D6F06A" style="animation-delay:2.4s"/></g>
</svg>
