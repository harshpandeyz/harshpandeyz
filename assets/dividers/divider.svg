<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="64" viewBox="0 0 1600 64" role="img" aria-label="Decorative section divider">
<title>Section divider</title>
<defs>
<linearGradient id="dv-line" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#D6F06A"/><stop offset=".5" stop-color="#B87445"/><stop offset="1" stop-color="#9BAE91"/></linearGradient>
</defs>
<style><![CDATA[
.dv-flow{stroke-dasharray:6 12;animation:dvFlow 6s linear infinite}@keyframes dvFlow{to{stroke-dashoffset:-180}}
.dv-pulse{animation:dvPulse 2.8s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes dvPulse{0%,100%{opacity:.55;transform:scale(1)}50%{opacity:1;transform:scale(1.25)}}
.dv-tw{animation:dvTw 3.2s ease-in-out infinite}@keyframes dvTw{0%,100%{opacity:.3}50%{opacity:1}}
@media(prefers-reduced-motion:reduce){.dv-flow,.dv-pulse,.dv-tw{animation:none}}
]]></style>
<path d="M48 32H728M872 32H1552" stroke="url(#dv-line)" stroke-width="1.6" opacity=".7" class="dv-flow"/>
<g class="dv-pulse"><rect x="788" y="18" width="28" height="28" rx="4" transform="rotate(45 802 32)" fill="none" stroke="#D6F06A" stroke-width="2"/><circle cx="802" cy="32" r="3.4" fill="#D6F06A"/></g>
<circle cx="748" cy="32" r="2.4" fill="#B87445" class="dv-tw"/><circle cx="852" cy="32" r="2.4" fill="#9BAE91" class="dv-tw" style="animation-delay:1.1s"/>
<circle cx="48" cy="32" r="2" fill="#D8C09E" opacity=".6"/><circle cx="1552" cy="32" r="2" fill="#D8C09E" opacity=".6"/>
</svg>
