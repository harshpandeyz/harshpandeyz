<svg xmlns="http://www.w3.org/2000/svg" width="960" height="190" viewBox="0 0 960 190" role="img" aria-label="OrchestraAI — adaptive model orchestration">
  <defs>
    <linearGradient id="orBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#070D22"/>
      <stop offset="1" stop-color="#0C1A33"/>
    </linearGradient>
    <radialGradient id="orGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="orRoute" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B82F6"/>
      <stop offset="0.5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
  </defs>
  <rect width="960" height="190" rx="14" fill="url(#orBg)"/>
  <ellipse cx="790" cy="95" rx="220" ry="110" fill="url(#orGlow)"/>
  <rect x="1" y="1" width="958" height="188" rx="13" fill="none" stroke="#22304F" stroke-width="1.5"/>
  <rect x="1" y="1" width="6" height="188" fill="url(#orRoute)"/>

  <text x="44" y="66" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" letter-spacing="4" fill="#22D3EE">04 · AGENT ORCHESTRATION</text>
  <text x="42" y="112" font-family="system-ui,-apple-system,'Segoe UI',Inter,sans-serif" font-size="36" font-weight="700" letter-spacing="-0.5" fill="#F2F6FD">OrchestraAI</text>
  <text x="44" y="146" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" letter-spacing="1" fill="#8B98B8">model routing · tool execution · cost + telemetry</text>

  <!-- routing motif -->
  <g fill="none" stroke-linecap="round">
    <path d="M700 55 C 750 55, 760 80, 810 88" stroke="#3B82F6" stroke-width="2"/>
    <path d="M700 95 C 750 95, 760 95, 810 95" stroke="url(#orRoute)" stroke-width="2.5" stroke-dasharray="8 7">
      <animate attributeName="stroke-dashoffset" from="0" to="-60" dur="1.8s" repeatCount="indefinite"/>
    </path>
    <path d="M700 135 C 750 135, 760 110, 810 102" stroke="#A78BFA" stroke-width="2"/>
    <circle cx="700" cy="55" r="6" fill="#0C1631" stroke="#3B82F6" stroke-width="2"/>
    <circle cx="700" cy="95" r="6" fill="#0C1631" stroke="#22D3EE" stroke-width="2"/>
    <circle cx="700" cy="135" r="6" fill="#0C1631" stroke="#A78BFA" stroke-width="2"/>
    <rect x="810" y="72" width="52" height="46" rx="9" fill="#0C1631" stroke="#22D3EE" stroke-width="1.5"/>
    <circle cx="836" cy="95" r="6" fill="#22D3EE">
      <animate attributeName="opacity" values="1;0.3;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <path d="M862 95 h28" stroke="#22D3EE" stroke-width="2"/>
    <circle cx="898" cy="95" r="5" fill="none" stroke="#22D3EE" stroke-width="2"/>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="1" fill="#8B98B8">
    <text x="676" y="40">MODELS</text>
    <text x="812" y="60">ROUTE</text>
  </g>
</svg>
