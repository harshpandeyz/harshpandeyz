<svg xmlns="http://www.w3.org/2000/svg" width="960" height="190" viewBox="0 0 960 190" role="img" aria-label="QuantumMind AI — modular research intelligence platform">
  <defs>
    <linearGradient id="qmBg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0A0B22"/>
      <stop offset="1" stop-color="#141233"/>
    </linearGradient>
    <radialGradient id="qmGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#A78BFA" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#A78BFA" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="960" height="190" rx="14" fill="url(#qmBg)"/>
  <ellipse cx="790" cy="95" rx="220" ry="110" fill="url(#qmGlow)"/>
  <rect x="1" y="1" width="958" height="188" rx="13" fill="none" stroke="#22304F" stroke-width="1.5"/>
  <rect x="1" y="1" width="6" height="188" fill="#A78BFA"/>

  <text x="44" y="66" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="14" letter-spacing="4" fill="#A78BFA">02 · MODULAR AI PLATFORM</text>
  <text x="42" y="112" font-family="system-ui,-apple-system,'Segoe UI',Inter,sans-serif" font-size="36" font-weight="700" letter-spacing="-0.5" fill="#F2F6FD">QuantumMind AI</text>
  <text x="44" y="146" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="13" letter-spacing="1" fill="#8B98B8">Spring Boot · React · Python services · Docker</text>

  <!-- constellation motif -->
  <g stroke="#A78BFA" stroke-width="1.5" opacity="0.75">
    <line x1="730" y1="60" x2="790" y2="95"/>
    <line x1="790" y1="95" x2="860" y2="60"/>
    <line x1="790" y1="95" x2="800" y2="150"/>
    <line x1="730" y1="60" x2="800" y2="150" opacity="0.4"/>
    <line x1="860" y1="60" x2="800" y2="150" opacity="0.4"/>
  </g>
  <g>
    <circle cx="730" cy="60" r="7" fill="#0C1631" stroke="#A78BFA" stroke-width="2"/>
    <circle cx="860" cy="60" r="7" fill="#0C1631" stroke="#A78BFA" stroke-width="2"/>
    <circle cx="790" cy="95" r="11" fill="#A78BFA">
      <animate attributeName="opacity" values="1;0.4;1" dur="2.6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="790" cy="95" r="18" fill="none" stroke="#A78BFA" stroke-opacity="0.5"/>
    <circle cx="800" cy="150" r="7" fill="#0C1631" stroke="#A78BFA" stroke-width="2"/>
  </g>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="11" letter-spacing="1" fill="#8B98B8">
    <text x="712" y="44">API</text>
    <text x="848" y="44">WEB</text>
    <text x="816" y="168">AI</text>
  </g>
</svg>
