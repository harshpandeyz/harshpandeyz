<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="600" viewBox="0 0 1600 600" role="img" aria-labelledby="t-title t-desc">
<title id="t-title">Activity trends — rhythms and releases</title><desc id="t-desc">A hand-plotted contribution area chart, a weekly rhythm line, and repository update bars.</desc>
<defs><linearGradient id="t-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#211C1A"/><stop offset="1" stop-color="#121716"/></linearGradient><linearGradient id="t-area" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#D6F06A" stop-opacity=".32"/><stop offset="1" stop-color="#D6F06A" stop-opacity=".01"/></linearGradient><pattern id="t-grid" width="80" height="60" patternUnits="userSpaceOnUse"><path d="M80 0H0V60" fill="none" stroke="#D8C09E" stroke-opacity=".07"/></pattern></defs>
<style><![CDATA[.t-draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:tDraw 2.4s ease-out forwards}@keyframes tDraw{to{stroke-dashoffset:0}}.t-bar{animation:tBar 1.3s ease-out both;transform-box:fill-box;transform-origin:bottom}@keyframes tBar{from{transform:scaleY(0)}to{transform:scaleY(1)}}.t-last{animation:tPulse 2.2s ease-in-out infinite}@keyframes tPulse{0%,100%{r:5}50%{r:8}}@media(prefers-reduced-motion:reduce){.t-draw,.t-bar,.t-last{animation:none}}]]></style>
<rect width="1600" height="600" rx="28" fill="url(#t-bg)"/><rect width="1600" height="600" rx="28" fill="url(#t-grid)" opacity=".75"/><path d="M48 86H1552" stroke="#D8C09E" stroke-opacity=".24"/><text x="48" y="52" fill="#F6EAD5" font-family="Georgia,serif" font-size="29">Rhythms, not vanity metrics</text><text x="1552" y="51" text-anchor="end" fill="#AFA08E" font-family="Arial,sans-serif" font-size="12">contributions · 26-week rhythm · repository pulse</text>
