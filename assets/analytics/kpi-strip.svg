<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="470" viewBox="0 0 1600 470" role="img" aria-labelledby="k-title k-desc">
<title id="k-title">GitHub intelligence — a measured year</title><desc id="k-desc">Live GitHub metrics with contributions, stars, repositories, followers, streak and pull requests, followed by monthly contributions.</desc>
<defs><linearGradient id="k-bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#211C1A"/><stop offset="1" stop-color="#111615"/></linearGradient><linearGradient id="k-copper" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#D6F06A"/><stop offset=".45" stop-color="#E8B17B"/><stop offset="1" stop-color="#B87445"/></linearGradient><pattern id="k-grain" width="80" height="80" patternUnits="userSpaceOnUse"><circle cx="9" cy="18" r=".7" fill="#F6EAD5" opacity=".14"/><circle cx="54" cy="67" r=".5" fill="#D6F06A" opacity=".11"/></pattern></defs>
<style><![CDATA[.k-card{transition:filter .3s}.k-card:hover{filter:brightness(1.18)}.k-bar{animation:kRise 1.2s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:bottom}@keyframes kRise{from{transform:scaleY(0)}to{transform:scaleY(1)}}.k-dot{animation:kPulse 2.6s ease-in-out infinite}@keyframes kPulse{0%,100%{opacity:.55}50%{opacity:1}}@media(prefers-reduced-motion:reduce){.k-bar,.k-dot{animation:none}}]]></style>
<rect width="1600" height="470" rx="28" fill="url(#k-bg)"/><rect width="1600" height="470" rx="28" fill="url(#k-grain)" opacity=".55"/><path d="M48 86H1552" stroke="#D8C09E" stroke-opacity=".25"/>
